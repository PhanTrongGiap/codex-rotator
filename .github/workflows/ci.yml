name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -o codex-rotator ./cmd/codex-rotator
